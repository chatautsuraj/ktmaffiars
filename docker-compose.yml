services:
  ui:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${UI_PUBLISH_PORT}:3000"
    environment:
      NODE_ENV: production
      # Required in production (auth fails closed without them):
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      # Optional:
      CRON_SECRET: ${CRON_SECRET:-}
      AUTOPILOT_HALTED: ${AUTOPILOT_HALTED:-true}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AUTOPILOT_MODEL: ${AUTOPILOT_MODEL:-gpt-4o-mini}
    volumes:
      # Persist CMS content and uploads across container rebuilds
      - ./content:/app/content
      - ./public/uploads:/app/public/uploads
